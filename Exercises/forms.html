<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="Styles/forms.css">
    
</head>
<body>
    <form action="mailto:emmy@em.com" method="post"
    enctype="text/plain">
    <fieldset>
        <Legend>Personal Details</Legend>
        <div>
            <label for="username">Username:</label><br>
            <input type="text" name="username" id="username" required>
        </div>
        
        <div>
            <label for="password">Password:</label><br>
            <input type="password" name="password" id="password">
        </div>
        <div>
            <label for="confirm">Confirm:</label><br>
            <input type="password" name="confirm" id="confirm">
        </div>
        <div>
            <p>Age Group</p>
            <input type="radio" name="age" id="age1" value="1">
            <label for="age">15-20</label>
            <br>            
            <input type="radio" name="age" id="age2" value="2" required>
            <label for="age">21-30</label>
            <br>            
            <input type="radio" name="age" id="age3" value="3"> 
            <label for="age">31-40</label>
            <br>            
            <input type="radio" name="age" id="age4" value="4">
            <label for="age">41+</label>
            <br>            
        </div>
        <br>
        <div>
            <input type="checkbox" name="Gaming" id="Gaming">
            <label for="">Gaming</label>
            <br>            
            <input type="checkbox" name="Singing" id="Singing">
            <label for="">Singing</label>
            <br>            
            <input type="checkbox" name="Meth" id="Meth">
            <label for="">Meth</label>
            <br>            
            <input type="checkbox" name="Crochet" id="Crochet">
            <label for="">Crochet</label>
            <br>            
        </div>
        
        
    </fieldset>
    <fieldset>
        <legend>Contact Information</legend>
        <div>
            <label for="email">Email:</label><br>
            <input type="email" name="email" id="email">
        </div>
        <div>
            <label for="phone">Phone Number:</label><br>
            <input type="tel" name="phone" id="phone">
        </div>
        
    </fieldset>
    <fieldset>
        <legend>Account settings</legend>
        <div>
            <label for="">Account Type</label><br><br>
            <select name="accountType" id="accountType" required>
                <option value="" disabled selected>Select An Account</option>
                <option value="1">User</option>
                <option value="2">Admin</option>
                <option value="3">Guest</option>
            </select>
        </div>
        <div>
            <label for="bio"></label>
            <textarea name="bio" id="bio"
            cols="30" rows="10"></textarea>
        </div>
    </fieldset>
    <div>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
    </div>
</form>
<p></p>
</body>
</html>
